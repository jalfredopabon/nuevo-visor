<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Tree Diagram Styles */
        .tree-line-h {
            position: absolute;
            height: 2px;
            background-color: #e1e3e4;
            top: 50%;
            transform: translateY(-50%);
            z-index: 0;
        }
        .tree-line-v {
            position: absolute;
            width: 2px;
            background-color: #e1e3e4;
            left: 0;
            z-index: 0;
        }
        .tree-node {
            position: relative;
            z-index: 10;
        }

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased">
<!-- Top Navigation (Seamless, no borders) -->
<header class="w-full top-0 sticky bg-surface-bright z-50">

<main class="flex-grow px-margin-mobile md:px-margin-desktop py-12 max-w-container-max mx-auto w-full">
<!-- Header Section -->
<div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-12">
<h1 class="font-display-lg text-display-lg text-on-background">Mapa Operativo</h1>

<div class="flex bg-surface-container-low rounded-full p-1 border border-outline">
<button class="flex items-center gap-2 px-6 py-2 rounded-full bg-primary text-on-primary font-label-md text-label-md shadow-sm transition-all">
<span>📍</span> Vista Geográfica
                </button>
<button class="flex items-center gap-2 px-6 py-2 rounded-full text-secondary hover:text-on-surface font-label-md text-label-md transition-all">
<span>🧩</span> Vista por Componente
                </button>
</div>
</div>
<!-- Tree Diagram Canvas -->
<div class="bg-surface rounded-xl p-8 md:p-16 shadow-[0px_4px_20px_rgba(0,0,0,0.04)] min-h-[600px] overflow-x-auto relative">
<div class="min-w-[800px] relative flex items-center h-[500px]">
<!-- Level 1: Root -->
<div class="w-1/4 relative flex items-center justify-start h-full">
<div class="tree-node bg-diagram-navy text-on-primary rounded-lg px-8 py-6 shadow-sm border-none w-64 text-center">
<span class="font-headline-md text-headline-md block">ConEsperanza</span>
</div>
<!-- Connecting line to Level 2 -->
<div class="tree-line-h w-full left-[16rem]"></div>
</div>
<!-- Level 2: Branches -->
<div class="w-1/4 relative h-full flex flex-col justify-around py-20">
<!-- Vertical connecting line -->
<div class="tree-line-v h-[280px] top-[110px]"></div>
<!-- Branch 1: Cauca -->
<div class="relative w-full flex items-center justify-center">
<div class="tree-line-h w-full right-1/2"></div>
<div class="tree-node bg-diagram-blue text-on-primary rounded-lg px-6 py-4 shadow-sm border-none w-56 text-center">

</div>
<div class="tree-line-h w-full left-1/2"></div>
</div>
<!-- Branch 2: Norte de Santander -->

</div>

</div>

<div class="tree-line-h w-12 -left-12"></div>

<span class="font-body-md text-body-md block">Protección</span>
</div>
</div>
<div class="relative flex items-center">

<span class="font-body-md text-body-md block">Salud</span>
</div>
</div>
<div class="relative flex items-center">
<div class="tree-line-h w-12 -left-12"></div>

<span class="font-body-md text-body-md block">Salud</span>
